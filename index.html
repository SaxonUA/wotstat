<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <title>Рембо Челендж</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/flipclock/0.7.8/flipclock.css">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet">
  <style>
    body {
      background: url('РЕМБО САКСОН (1).png') no-repeat center center;
      background-size: cover;
      font-family: 'Arial Black', sans-serif;
      color: white;
      text-align: center;
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .overlay {
      background-color: rgba(0, 0, 0, 0.0);
      border-radius: 30px;
      padding: 25px 50px;
      width: fit-content;
      margin: 0 auto;
    }

    .title {
      font-size: 28px;
      font-weight: bold;
      color: white;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
    }

    .divider {
      margin: 20px 0;
    }

    .damage-block {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .label {
      font-size: 22px;
      color: orange;
      font-family: 'Orbitron', sans-serif;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.7), 0 0 10px rgba(255,140,0,0.8);
      margin-bottom: 10px;
    }

    .flip-damage .flip-clock-wrapper {
      background-color: rgba(0, 0, 0, 0.5);
      border: 2px solid orange;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(255, 140, 0, 0.6);
    }

    .note {
      font-size: 18px;
      font-weight: bold;
      margin: 5px 0;
    }

    .note-gradient {
      background: linear-gradient(270deg, orange, white);
      background-size: 400% 50%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: gradientMove 6s ease infinite;
    }

    @keyframes gradientMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .countdown-wrapper {
      margin-top: 20px;
    }

    .flip-clock-wrapper ul li a div div.inn {
      font-size: 70px;
    }

    .rembo-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 40px;
      color: orange;
      margin-bottom: 10px;
      text-transform: uppercase;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.7), 0 0 10px rgba(255,140,0,0.8);
    }
  </style>
</head>
<body>
  <div class="overlay">
    <div class="title">РЕМБО ЧЕЛЕНДЖ</div>
    <div class="divider"></div>

    <div class="damage-block">
      <div class="label">ЗАЛИШИЛОСЬ НАСТРІЛЯТИ:</div>
      <div class="flip-damage">
        <div id="damage-clock"></div>
      </div>
    </div>

    <div class="divider"></div>
    <div class="note note-gradient">+200 урону за 1 лайк YouTube</div>
    <div class="note note-gradient">+1 урон за 1 тап в TikTok</div>
    <div class="note note-gradient">+50 урону за 1 грн</div>

    <div class="countdown-wrapper">
      <div class="flip-clock-wrapper">
      <div class="rembo-title">До кінця челенджу</div>
         <div class="rembo-title">залишилось:</div>
        <div id="flip-clock"></div>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/flipclock/0.7.8/flipclock.min.js"></script>
  <script>
    const SHEET_ID = "17phnEn-NW-OnrZg4DcW65r-Xoq6ScsdVjS5yL0SS3fk";
    const GID = "1630188258";

    async function fetchSingleCell(range) {
      const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?gid=${GID}&range=${range}&tqx=out:json`;
      const res = await fetch(url);
      const text = await res.text();
      const json = JSON.parse(text.substring(47).slice(0, -2));
      return json.table.rows[0].c[0]?.v || 0;
    }

    $(document).ready(function() {
      // Таймер
      const flipClock = $('#flip-clock').FlipClock(getTimeLeftKyiv(), {
        clockFace: 'HourlyCounter',
        countdown: true,
        autoStart: true
      });
      setInterval(() => {
        flipClock.setTime(getTimeLeftKyiv());
      }, 60000);

      // Дамаг
      const damageClock = $('#damage-clock').FlipClock(0, {
        clockFace: 'Counter',
        autoStart: false
      });

      async function updateDamage() {
        try {
          const left = await fetchSingleCell("C14");
          damageClock.setValue(left);
        } catch (err) {
          console.error("Помилка оновлення дамага:", err);
        }
      }
      updateDamage();
      setInterval(updateDamage, 15000);
    });

    function getTimeLeftKyiv() {
      const now = new Date();
      const kyivNow = new Date(now.toLocaleString("en-US", { timeZone: "Europe/Kyiv" }));
      const end = new Date(kyivNow);
      end.setHours(23, 59, 59, 999);
      return Math.floor((end - kyivNow) / 1000);
    }
  </script>
</body>
</html>
