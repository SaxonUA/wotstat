<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <title>Рембо Челендж</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/flipclock/0.7.8/flipclock.css">
  <style>
    body {
      background: url('РЕМБО САКСОН (1).png') no-repeat center center;
      background-size: cover;
      font-family: 'Arial Black', sans-serif;
      color: white;
      text-align: center;
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .overlay {
      background-color: rgba(0, 0, 0, 0.0);
      border-radius: 30px;
      padding: 25px 50px;
      width: fit-content;
      margin: 0 auto;
    }

    .title {
      font-size: 28px;
      font-weight: bold;
      color: white;
    }

    .divider {
      margin: 20px 0;
    }

    .line {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
    }

    .label {
      font-size: 22px;
      color: orange;
      text-align: right;
    }

    .value {
      font-size: 36px;
      font-weight: bold;
      background: repeating-linear-gradient(-45deg, rgba(128,128,128,0.3) 0px, rgba(128,128,128,0.3) 8px, transparent 8px, transparent 16px);
      border: 2px solid orange;
      border-radius: 10px;
      padding: 10px 20px;
      min-width: 140px;
      text-align: left;
    }

    .increase {
      animation: fadeGreen 0.5s ease;
    }

    .decrease {
      animation: fadeRed 0.5s ease;
    }

    @keyframes fadeGreen {
      0% { color: lime; opacity: 0; transform: scale(1.1); }
      50% { color: lime; opacity: 0.5; }
      100% { color: white; opacity: 1; transform: scale(1); }
    }

    @keyframes fadeRed {
      0% { color: red; opacity: 0; transform: scale(1.1); }
      50% { color: red; opacity: 0.5; }
      100% { color: white; opacity: 1; transform: scale(1); }
    }

    .note {
      font-size: 18px;
      font-weight: bold;
      margin: 5px 0;
    }

    .note-gradient {
      background: linear-gradient(270deg, orange, white);
      background-size: 400% 50%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: gradientMove 6s ease infinite;
    }

    @keyframes gradientMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .countdown-wrapper {
      margin-top: 20px;
    }

    /* Зовнішня помаранчева рамка */
    .flip-clock-wrapper {
      background-color: rgba(0, 0, 0, 0.1);
      border: px solid white;
      border-radius: 20px;
      padding: 5px;
      box-shadow: 0 0 20px rgba(255, 0, 0, 0.0);
      display: block;
      width: fit-content;
      overflow: hidden;
      margin: 0 auto;
    }

    

    .flip-clock-wrapper ul {
      float: left;
    }

    .flip-clock-wrapper ul li a div div.inn {
      font-size: 70px;
    }

    .rembo-title {
      font-size: 60px;
      color: orange;
      text-shadow: 2px 2px 4px rgba(255, 255, 255, 0.3); /* тінь */
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7); /* тінь */
     
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="overlay">
    <div class="title"> РЕМБО ЧЕЛЕНДЖ </div>
    <div class="divider"></div>
    <div class="line">
      <div class="label">ЗАЛИШИЛОСЬ<br>НАСТРІЛЯТИ:</div>
      <div class="value" id="left2">...</div>
    </div>
    <div class="divider"></div>
    <div class="note note-gradient">+200 урону за 1 лайк YouTube</div>
    <div class="note note-gradient">+1 урон за 1 тап в TikTok</div>
    <div class="note note-gradient">+50 урону за 1 грн</div>

    <div class="countdown-wrapper">
      <div class="flip-clock-wrapper">
        <div class="rembo-title">До кінця</div>
        <div class="rembo-title">челенджу:</div>
        <div class="flip-clock-inner">
          <div id="flip-clock"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/flipclock/0.7.8/flipclock.min.js"></script>
  <script>
    const SHEET_ID = "17phnEn-NW-OnrZg4DcW65r-Xoq6ScsdVjS5yL0SS3fk";
    const GID = "1630188258";

    async function fetchSingleCell(range) {
      const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?gid=${GID}&range=${range}&tqx=out:json`;
      const res = await fetch(url);
      const text = await res.text();
      const json = JSON.parse(text.substring(47).slice(0, -2));
      return json.table.rows[0].c[0]?.v || 0;
    }

    function animateValue(id, newValue) {
      const el = document.getElementById(id);
      if (!el) return;

      const oldValue = parseInt(el.innerText.replace(/\D/g, "")) || 0;
      const valueChanged = newValue !== oldValue;

      if (valueChanged) {
        el.classList.remove("increase", "decrease");

        if (newValue > oldValue) {
          el.classList.add("increase");
        } else {
          el.classList.add("decrease");
        }

        el.innerText = Number(newValue).toLocaleString();
        setTimeout(() => el.classList.remove("increase", "decrease"), 500);
      }
    }

    async function updateUI() {
      try {
        const left = await fetchSingleCell("C14");
        animateValue("left2", left);
      } catch (err) {
        console.error("Помилка оновлення даних:", err);
        const el = document.getElementById("left2");
        if (el) el.innerText = "Помилка";
      }
    }

    function getTimeLeftKyiv() {
      const now = new Date();
      const kyivNow = new Date(now.toLocaleString("en-US", { timeZone: "Europe/Kyiv" }));
      const end = new Date(kyivNow);
      end.setHours(23, 59, 59, 999);
      return Math.floor((end - kyivNow) / 1000);
    }

    $(document).ready(function() {
      const flipClock = $('#flip-clock').FlipClock(getTimeLeftKyiv(), {
        clockFace: 'HourlyCounter',
        countdown: true,
        autoStart: true
      });
      setInterval(() => {
        flipClock.setTime(getTimeLeftKyiv());
      }, 60000);
    });

    updateUI();
    setInterval(updateUI, 15000);
  </script>
</body>
</html>
