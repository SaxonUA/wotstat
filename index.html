<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <title>WOT донати та лайки</title>
  <style>
    body {
      background-color: transparent;
      font-family: 'Arial Black', sans-serif;
      color: white;
      text-align: center;
      margin: 0;
      padding: 0;
    }

    .container, .container-bottom {
      background-color: rgba(0, 0, 0, 0.6);
      border-radius: 30px;
      padding: 25px 50px;
      width: fit-content;
      margin: 30px auto;
      box-shadow: 0 0 40px rgba(255,140,0,0.3);
    }

    .line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 20px 0;
    }

    .title {
      font-size: 22px;
      line-height: 1.2;
      font-weight: bold;
      text-transform: uppercase;
      background: linear-gradient(to right, #ffcc00, orange);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      opacity: 0.9;
    }

    .value {
      font-size: 36px;
      font-weight: bold;
      color: #fff;
      background: repeating-linear-gradient(135deg, rgba(255,255,255,0.2) 0px, rgba(255,255,255,0.2) 8px, transparent 8px, transparent 16px);
      padding: 10px 20px;
      border-radius: 10px;
      box-shadow: inset 0 0 10px rgba(255,255,255,0.2);
      min-width: 140px;
      transition: transform 0.3s ease, color 0.3s ease;
    }

    .value.updated {
      transform: scale(1.2);
      color: orange;
    }

    .divider {
      border-top: 3px solid #ff9900;
      margin: 20px 0;
    }

    .note {
      font-size: 22px;
      font-weight: bold;
      margin-top: 20px;
      background: linear-gradient(to right, #ffffff, orange);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Стилі для таймера в стилі Рембо */
    .countdown-wrapper {
      width: fit-content;
      margin: 10px auto 30px auto;
    }

    .countdown-box-rembo {
      background-color: rgba(0, 0, 0, 0.6);
      color: white;
      font-family: 'Arial Black', sans-serif;
      border: 2px solid orange;
      border-radius: 20px;
      padding: 20px 30px;
      box-shadow: 0 0 20px rgba(255, 0, 0, 0.6);
      display: inline-block;
      min-width: 360px;
    }

    .rembo-title {
      font-size: 20px;
      color: #ffff66;
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    .rembo-time {
      font-size: 28px;
      font-weight: bold;
      color: white;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="line"><div class="title">Початково</div><div class="value" id="start">...</div></div>
    <div class="divider"></div>
    <div class="line"><div class="title">За донати</div><div class="value" id="donations">...</div></div>
    <div class="line"><div class="title">За лайки</div><div class="value" id="likes">...</div></div>
    <div class="divider"></div>
    <div class="line"><div class="title">Всього<br>за стрім</div><div class="value" id="total">...</div></div>
    <div class="line"><div class="title">Вже<br>настріляв</div><div class="value" id="done">...</div></div>
  </div>

  <div class="container-bottom">
    <div class="line"><div class="title">Залишилось<br>виконати</div><div class="value" id="left">...</div></div>
    <div class="divider"></div>
    <div class="note">Кожна 1 грн додає <span style="color: orange">50 урону</span></div>
    <div class="note">Кожен 1 лайк додає <span style="color: orange">500 урону</span></div>
  </div>

  <div class="container-bottom" style="rgba(0, 0, 0, 0.6); border: 2px solid red; box-shadow: 0 0 30px rgba(255,0,0,0.5); font-family: 'Arial Black', sans-serif; text-align: center; margin: 30px auto; display: inline-block;">
    <div class="line">
      <div class="title" style="color: white; font-size: 28px; background: none; -webkit-text-fill-color: white;">💥 РЕМБО ЧЕЛЕНДЖ 💥</div>
    </div>
    <div class="divider" style="border-top: 2px dashed red;"></div>
    <div class="line"><div class="title" style="color: orange; text-align: left;">ЗАЛИШИЛОСЬ<br>НАСТРІЛЯТИ:</div><div class="value" id="left2" style="font-size: 36px; background: repeating-linear-gradient(45deg, rgba(255,0,0,0.3) 0px, rgba(255,0,0,0.3) 8px, transparent 8px, transparent 16px); border: 2px solid red;">...</div></div>
    <div class="divider" style="border-top: 2px dashed red;"></div>
    <div class="note" style="color: orange;">+50 урону за 1 грн</div>
    <div class="note" style="color: orange;">+500 урону за 1 лайк</div>
  </div>

  <div class="countdown-wrapper">
    <div class="countdown-box-rembo">
      <div class="rembo-title">До кінця челенджу:</div>
      <div id="countdown" class="rembo-time">...</div>
    </div>
  </div>

  <script>
    const SHEET_ID = "17phnEn-NW-OnrZg4DcW65r-Xoq6ScsdVjS5yL0SS3fk";
    const GID = "1630188258";

    async function fetchSingleCell(range) {
      const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?gid=${GID}&range=${range}&tqx=out:json`;
      const res = await fetch(url);
      const text = await res.text();
      const json = JSON.parse(text.substring(47).slice(0, -2));
      return json.table.rows[0].c[0]?.v || 0;
    }

    function animateValue(id, newValue) {
      const el = document.getElementById(id);
      if (!el) return;

      const oldValue = parseInt(el.innerText.replace(/\D/g, "")) || 0;
      const valueChanged = newValue !== oldValue;

      if (valueChanged) {
        el.classList.add("updated");
        el.innerText = Number(newValue).toLocaleString();
        setTimeout(() => el.classList.remove("updated"), 500);
      } else {
        el.innerText = Number(newValue).toLocaleString();
      }
    }

    async function updateUI() {
      try {
        const [start, donations, likes, total, done, left] = await Promise.all([
          fetchSingleCell("C7"),
          fetchSingleCell("C8"),
          fetchSingleCell("C9"),
          fetchSingleCell("C10"),
          fetchSingleCell("C12"),
          fetchSingleCell("C14")
        ]);

        animateValue("start", start);
        animateValue("donations", donations);
        animateValue("likes", likes);
        animateValue("total", total);
        animateValue("done", done);
        animateValue("left", left);
        animateValue("left2", left);

      } catch (err) {
        console.error("Помилка оновлення даних:", err);
        ["start", "donations", "likes", "total", "done", "left", "left2"].forEach(id => {
          const el = document.getElementById(id);
          if (el) el.innerText = "Помилка";
        });
      }
    }

    function updateCountdown() {
      const now = new Date();
      const target = new Date();
      target.setHours(23, 59, 59, 999);
      const diff = target - now;
      const countdown = document.getElementById("countdown");
      if (!countdown) return;
      if (diff <= 0) {
        countdown.innerText = "Час вийшов!";
      } else {
        const hrs = String(Math.floor(diff / 3600000)).padStart(2, '0');
        const mins = String(Math.floor((diff % 3600000) / 60000)).padStart(2, '0');
        const secs = String(Math.floor((diff % 60000) / 1000)).padStart(2, '0');
        countdown.innerText = `${hrs}г ${mins}хв ${secs}сек`;
      }
    }

    updateUI();
    updateCountdown();
    setInterval(updateUI, 15000);
    setInterval(updateCountdown, 1000);
  </script>
</body>
</html>
