<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <title>WANTED COUNT</title>
  <link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      background-color: transparent;
      font-family: 'Special Elite', serif;
      color: #4B2E13;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    .container {
      width: 150px;
      background-color: rgba(255, 255, 255, 0);
      padding: 0;
      box-sizing: border-box;
    }

   

    .center-area {
      height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .count {
      font-size: 100px;
      line-height: 0.85;
      height: 10px;
      color: #4B2E13;
      text-shadow: 2px 2px 2px #e6c298;
      font-family: 'Special Elite', serif;
      margin: 0;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .footer {
      font-size: 18px;
      font-weight: bold;
      text-align: center;
      text-shadow: 1px 1px 1px #e6c298;
      margin-top: 4px;
    }

    .progress-bar {
      width: 80%;
      height: 14px;
      background-color: #f5e4c4;
      border: 2px solid #8B3E1F;
      border-radius: 7px;
      margin: 6px auto 0 auto;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background-color: #4B2E13;
      transition: width 0.5s ease-in-out;
    }

    .animated {
      animation: pop 0.4s ease-in-out;
    }

    @keyframes pop {
      0% { transform: scale(1); }
      50% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="divider"></div>

    <div class="center-area">
      <div class="count" id="artilleryCount">0</div>
    </div>

    <div class="divider"></div>

    <div class="footer">
      Боїв: <span id="battleCount">0</span> з <span id="battleGoal">10</span>
    </div>

    <div class="progress-bar">
      <div class="progress-fill" id="progressFill"></div>
    </div>
  </div>

  <script>
    const maxBattles = 10;

    async function fetchStats() {
      const sheetId = '17phnEn-NW-OnrZg4DcW65r-Xoq6ScsdVjS5yL0SS3fk';
      const sheetName = 'arta_sum';
      const url = `https://opensheet.elk.sh/${sheetId}/${sheetName}`;

      try {
        const response = await fetch(url);
        const data = await response.json();
        if (data.length > 0) {
          const row = data[0];
          const artillery = row['Сума арт'] || '0';
          const battles = row['К-ть боїв'] || '0';

          animateUpdate('artilleryCount', artillery);
          updateBattleText(battles);
          updateProgressBar(battles);
        }
      } catch (error) {
        console.error('Помилка при завантаженні даних:', error);
      }
    }

    function animateUpdate(id, newValue) {
      const el = document.getElementById(id);
      if (el.textContent !== newValue) {
        el.textContent = newValue;
        el.classList.add('animated');
        setTimeout(() => el.classList.remove('animated'), 400);
      }
    }

    function updateBattleText(battles) {
      document.getElementById('battleCount').textContent = battles;
      document.getElementById('battleGoal').textContent = maxBattles;
    }

    function updateProgressBar(battles) {
      const percent = Math.min(100, (parseInt(battles) / maxBattles) * 100);
      document.getElementById('progressFill').style.width = percent + '%';
    }

    fetchStats();
    setInterval(fetchStats, 15000);
  </script>
</body>
</html>
