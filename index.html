<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <title>WANTED ARTY</title>
  <link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      background: transparent;
      font-family: 'Special Elite', serif;
      color: #3b2b1a; /* темно-коричневий */
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      width: 300px;
      background-color: rgba(255, 255, 255, 0); /* повністю прозорий фон */
      text-align: center;
    }

    .title {
      font-size: 20px;
      font-weight: bold;
      line-height: 1.2;
      margin-bottom: 10px;
    }

    .divider {
      border-top: 2px solid #a0522d; /* saddle brown */
      margin: 10px 0;
    }

    .count {
      font-size: 100px;
      font-weight: bold;
      text-shadow: 2px 2px 0 #d2b48c; /* як на пергаменті */
      transition: transform 0.3s ease;
    }

    .footer {
      font-size: 18px;
      font-weight: bold;
      margin-top: 10px;
    }

    .animated {
      animation: pop 0.4s ease-in-out;
    }

    @keyframes pop {
      0% { transform: scale(1); }
      50% { transform: scale(1.3); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="title">
      К-ть<br>знищеної<br>артилерії
    </div>

    <div class="divider"></div>

    <div class="count" id="artilleryCount">0</div>

    <div class="divider"></div>

    <div class="footer">
      Боїв: <span id="battleCount">0</span> з <span id="battleGoal">10</span>
    </div>
  </div>

  <script>
    const maxBattles = 10;

    async function fetchStats() {
      const sheetId = '17phnEn-NW-OnrZg4DcW65r-Xoq6ScsdVjS5yL0SS3fk';
      const sheetName = 'arta_sum';
      const url = `https://opensheet.elk.sh/${sheetId}/${sheetName}`;

      try {
        const response = await fetch(url);
        const data = await response.json();
        if (data.length > 0) {
          const row = data[0];
          animateUpdate('artilleryCount', row['Сума арт'] || '0');
          updateBattleText(row['К-ть боїв'] || '0');
        }
      } catch (error) {
        console.error('Помилка при завантаженні даних:', error);
      }
    }

    function animateUpdate(id, newValue) {
      const el = document.getElementById(id);
      if (el.textContent !== newValue) {
        el.textContent = newValue;
        el.classList.add('animated');
        setTimeout(() => el.classList.remove('animated'), 400);
      }
    }

    function updateBattleText(battles) {
      document.getElementById('battleCount').textContent = battles;
      document.getElementById('battleGoal').textContent = maxBattles;
    }

    fetchStats();
    setInterval(fetchStats, 15000);
  </script>
</body>
</html>
