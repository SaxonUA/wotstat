<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <title>WOT донати та лайки</title>
  <style>
    body {
      background-color: transparent;
      font-family: 'Arial Black', sans-serif;
      color: white;
      text-align: center;
      margin: 0;
      padding: 0;
    }
    .container {
      background-color: rgba(0, 0, 0, 0.5);
      border-radius: 20px;
      padding: 20px 40px;
      width: fit-content;
      margin: 20px auto;
      box-shadow: 0 0 25px rgba(0,0,0,0.5);
    }
    .line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 15px 0;
    }
    .text-block {
      text-align: left;
      min-width: 170px;
    }
    .title {
      font-size: 18px;
      line-height: 1.2;
      font-weight: bold;
      text-transform: uppercase;
      background: linear-gradient(to right, orange, #ffcc00);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      opacity: 0.7;
    }
    .value {
      font-size: 30px;
      font-weight: bold;
      background: repeating-linear-gradient(45deg, rgba(255,255,255,0.25), rgba(255,255,255,0.25) 10px, transparent 10px, transparent 20px);
      padding: 5px 15px;
      border-radius: 5px;
      color: white;
    }
    .divider {
      border-top: 3px solid orange;
      margin: 10px 0;
    }
    .note {
      font-size: 20px;
      font-weight: bold;
      margin-top: 10px;
      background: linear-gradient(to right, white, orange);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="line"><div class="title">Початково</div><div class="value" id="start">...</div></div>
    <div class="line"><div class="title">За донати</div><div class="value" id="donations">...</div></div>
    <div class="line"><div class="title">За лайки</div><div class="value" id="likes">...</div></div>
    <div class="line"><div class="title">Всього за стрім</div><div class="value" id="total">...</div></div>

    <div class="divider"></div>

    <div class="line"><div class="title">Вже настріляв</div><div class="value" id="done">...</div></div>
    <div class="line"><div class="title">Залишилось виконати</div><div class="value" id="left">...</div></div>

    <div class="divider"></div>

    <div class="note">Кожна 1 грн додає 50 урону</div>
    <div class="note">Кожен 1 лайк додає 500 урону</div>
  </div>

  <script>
    const SHEET_ID = "17phnEn-NW-OnrZg4DcW65r-Xoq6ScsdVjS5yL0SS3fk";
    const GID = "1630188258"; // GID аркуша "WOT"

    async function fetchData() {
      const URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&tq&gid=${GID}`;
      const res = await fetch(URL);
      const text = await res.text();
      const json = JSON.parse(text.substring(47).slice(0, -2));
      return json.table.rows;
    }

    async function updateUI() {
      try {
        const rows = await fetchData();

        document.getElementById("start").innerText = rows[6]?.c[2]?.v?.toLocaleString() || "0";     // C7
        document.getElementById("donations").innerText = rows[7]?.c[2]?.v?.toLocaleString() || "0"; // C8
        document.getElementById("likes").innerText = rows[8]?.c[2]?.v?.toLocaleString() || "0";     // C9
        document.getElementById("total").innerText = rows[9]?.c[2]?.v?.toLocaleString() || "0";     // C10
        document.getElementById("done").innerText = rows[11]?.c[2]?.v?.toLocaleString() || "0";     // C12
        document.getElementById("left").innerText = rows[13]?.c[2]?.v?.toLocaleString() || "0";     // C14
      } catch (err) {
        console.error(err);
      }
    }

    updateUI();
    setInterval(updateUI, 15000);
  </script>
</body>
</html>
