<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <title>Рембо Челендж</title>
  <style>
    body {
      background: url('РЕМБО САКСОН (1).png') no-repeat center center;
      background-size: cover;
      font-family: 'Arial Black', sans-serif;
      color: white;
      text-align: center;
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .overlay {
      background-color: rgba(0, 0, 0, 0.0);
     border: 0px solid white;
      border-radius: 30px;
   
      padding: 25px 50px;
      width: fit-content;
      margin: 0 auto;
    }

    .title {
      font-size: 28px;
      font-weight: bold;
      color: white;
    }

    .divider {
     
      margin: 20px 0;
    }

    .line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 20px 0;
    }

    .label {
      font-size: 22px;
      color: orange;
      text-align: left;
    }

    .value {
      font-size: 36px;
      font-weight: bold;
      background: repeating-linear-gradient(-45deg, rgba(128,128,128,0.3) 0px, rgba(128,128,128,0.3) 8px, transparent 8px, transparent 16px);
      border: 2px solid red;
      border-radius: 10px;
      padding: 10px 20px;
      min-width: 140px;
    }

    .note {
      font-size: 18px;
      font-weight: bold;
      margin: 5px 0;
    }

    .note-gradient {
      background: linear-gradient(270deg, orange, white);
      background-size: 400% 50%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: gradientMove 6s ease infinite;
    }

    @keyframes gradientMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .countdown-wrapper {
      margin-top: 20px;
    }

    .countdown-box-rembo {
      background-color: rgba(0, 0, 0, 0.6);
      color: white;
      border: 2px solid orange;
      border-radius: 20px;
      padding: 20px 30px;
      box-shadow: 0 0 20px rgba(255, 0, 0, 0.6);
      display: inline-block;
      min-width: 360px;
    }

    .rembo-title {
      font-size: 20px;
      color: #ffff66;
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    .rembo-time {
      font-size: 28px;
      font-weight: bold;
      color: white;
    }
  </style>
</head>
<body>
  <div class="overlay">
    <div class="title"> РЕМБО ЧЕЛЕНДЖ </div>
    <div class="divider"></div>
    <div class="line">
      <div class="label">ЗАЛИШИЛОСЬ<br>НАСТРІЛЯТИ:</div>
      <div class="value" id="left2">...</div>
    </div>
    <div class="divider"></div>
        <div class="note note-gradient">+200 урону за 1 лайк YouTube</div>
    <div class="note note-gradient">+1 урон за 1 тап в TikTok</div>
     <div class="note note-gradient">+50 урону за 1 грн</div>
    <div class="countdown-wrapper">
      <div class="countdown-box-rembo">
        <div class="rembo-title">До кінця челенджу:</div>
        <div id="countdown" class="rembo-time">...</div>
      </div>
    </div>
  </div>

  <script>
    const SHEET_ID = "17phnEn-NW-OnrZg4DcW65r-Xoq6ScsdVjS5yL0SS3fk";
    const GID = "1630188258";

    async function fetchSingleCell(range) {
      const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?gid=${GID}&range=${range}&tqx=out:json`;
      const res = await fetch(url);
      const text = await res.text();
      const json = JSON.parse(text.substring(47).slice(0, -2));
      return json.table.rows[0].c[0]?.v || 0;
    }

    function animateValue(id, newValue) {
      const el = document.getElementById(id);
      if (!el) return;

      const oldValue = parseInt(el.innerText.replace(/\D/g, "")) || 0;
      const valueChanged = newValue !== oldValue;

      if (valueChanged) {
        el.classList.add("updated");
        el.innerText = Number(newValue).toLocaleString();
        setTimeout(() => el.classList.remove("updated"), 500);
      } else {
        el.innerText = Number(newValue).toLocaleString();
      }
    }

    async function updateUI() {
      try {
        const left = await fetchSingleCell("C14");
        animateValue("left2", left);
      } catch (err) {
        console.error("Помилка оновлення даних:", err);
        const el = document.getElementById("left2");
        if (el) el.innerText = "Помилка";
      }
    }

    function updateCountdown() {
      const now = new Date();
      const target = new Date();
      target.setHours(23, 59, 59, 999);
      const diff = target - now;
      const countdown = document.getElementById("countdown");
      if (!countdown) return;
      if (diff <= 0) {
        countdown.innerText = "Час вийшов!";
      } else {
        const hrs = String(Math.floor(diff / 3600000)).padStart(2, '0');
        const mins = String(Math.floor((diff % 3600000) / 60000)).padStart(2, '0');
        const secs = String(Math.floor((diff % 60000) / 1000)).padStart(2, '0');
        countdown.innerText = `${hrs}г ${mins}хв ${secs}сек`;
      }
    }

    updateUI();
    updateCountdown();
    setInterval(updateUI, 15000);
    setInterval(updateCountdown, 1000);
  </script>
</body>
</html>
