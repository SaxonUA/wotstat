<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Донат-таймер</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/flipclock/0.7.8/flipclock.css">
  <style>
    body {
      background: transparent;
      font-family: 'Orbitron', sans-serif;
      color: orange;
      text-align: center;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .clock { 
      display: inline-block;
      margin-top: 10px;
    }
    .timer-container {
      background: rgba(0, 0, 0, 0.5);
      padding: 20px;
      border-radius: 15px;
    }
    .wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    .spacer {
      height: 50px;
      width: 100%;
    }
    .title {
      font-family: 'Orbitron', sans-serif;
      font-size: 48px;
      color: orange;
      text-shadow: 0 0 10px rgba(255, 140, 0, 0.8);
      margin-bottom: 10px;
    }
    .subtitle {
      font-family: 'Orbitron', sans-serif;
      font-size: 36px;
      color: orange;
      text-shadow: 0 0 8px rgba(255, 140, 0, 0.8);
    }
    .alert-red {
      animation: blink-red 1s infinite;
    }
    @keyframes blink-red {
      0%, 100% { background-color: rgba(255, 0, 0, 0.5); }
      50% { background-color: rgba(0, 0, 0, 0.5); }
    }
    .blink-green {
      animation: blink-green 0.5s 2;
    }
    @keyframes blink-green {
      0%, 100% { background-color: rgba(0, 255, 0, 0.5); }
      50% { background-color: rgba(0, 0, 0, 0.5); }
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="title"></div>
    <div class="timer-container">
      <div class="clock" id="timer"></div>
    </div>

    <div class="spacer"></div>
    <div class="spacer"></div>
    <div class="subtitle"></div>

    <div class="timer-container">
      <div class="clock" id="stopwatch"></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/flipclock/0.7.8/flipclock.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/flipclock/0.7.8/lang/uk.js"></script>
  <script>
    let clock;
    let lastSeconds = 0;
    let lastDonationSum = 0;
    let animationInterval = null;

    async function fetchDonationSum() {
      const sheetId = '17phnEn-NW-OnrZg4DcW65r-Xoq6ScsdVjS5yL0SS3fk';
      const sheetName = 'BS';
      const cell = 'A1';
      const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json&sheet=${sheetName}&range=${cell}`;

      try {
        const response = await fetch(url);
        const text = await response.text();
        const json = JSON.parse(text.substring(47).slice(0, -2));
        const donationSum = parseFloat(json.table.rows[0].c[0].v);

        if (donationSum > lastDonationSum) {
          $('.timer-container:first').addClass('blink-green');
          setTimeout(() => $('.timer-container:first').removeClass('blink-green'), 1000);
        }
        lastDonationSum = donationSum;

        return donationSum;
      } catch (error) {
        console.error('Error fetching donation sum:', error);
        return lastDonationSum;
      }
    }

    function calculateStreamEnd(donationSum) {
      const now = new Date();
      const kyivNow = new Date(now.toLocaleString("en-US", { timeZone: "Europe/Kyiv" }));
      const streamStart = new Date(kyivNow);
      streamStart.setHours(16, 0, 0, 0);
      if (kyivNow > streamStart) {
        return new Date(streamStart.getTime() + 2 * 60 * 60 * 1000 + Math.floor(donationSum / 5) * 60 * 1000);
      } else {
        return streamStart;
      }
    }

    async function calculateRemainingSeconds() {
      const donationSum = await fetchDonationSum();
      const now = new Date();
      const kyivNow = new Date(now.toLocaleString("en-US", { timeZone: "Europe/Kyiv" }));
      const streamEnd = calculateStreamEnd(donationSum);
      const remainingSeconds = Math.floor((streamEnd - kyivNow) / 1000);
      return remainingSeconds > 0 ? remainingSeconds : 0;
    }

    async function initClock() {
      const remainingSeconds = await calculateRemainingSeconds();
      lastSeconds = remainingSeconds;
      clock = $('#timer').FlipClock(remainingSeconds, {
        language: 'uk',
        clockFace: 'DailyCounter',
        countdown: true,
        autoStart: true
      });
    }

    async function animateClockTo(targetSeconds) {
      if (animationInterval) clearInterval(animationInterval);
      animationInterval = setInterval(() => {
        if (lastSeconds === targetSeconds) {
          clearInterval(animationInterval);
          return;
        }
        lastSeconds += (targetSeconds > lastSeconds) ? 5 : -5;
        if ((targetSeconds > lastSeconds && lastSeconds + 5 > targetSeconds) || 
            (targetSeconds < lastSeconds && lastSeconds - 5 < targetSeconds)) {
          lastSeconds = targetSeconds;
        }
        clock.setTime(lastSeconds);
      }, 5);
    }

    async function updateClockTime() {
      const remainingSeconds = await calculateRemainingSeconds();
      if (remainingSeconds <= 300) {
        $('.timer-container:first').addClass('alert-red');
      } else {
        $('.timer-container:first').removeClass('alert-red');
      }
      if (remainingSeconds !== lastSeconds && remainingSeconds > 300) {
        animateClockTo(remainingSeconds);
      } else if (remainingSeconds <= 300 && remainingSeconds !== lastSeconds) {
        if (animationInterval) clearInterval(animationInterval);
        lastSeconds = remainingSeconds;
        clock.setTime(remainingSeconds);
        clock.start();
      }
    }

    $(document).ready(function() {
      initClock();
      setInterval(updateClockTime, 15000);

      setTimeout(() => {
        $('.flip-clock-label').each(function() {
          const text = $(this).text().trim();
          if (text === 'Days') $(this).text('Дні');
          if (text === 'Hours') $(this).text('Години');
          if (text === 'Minutes') $(this).text('Хвилини');
          if (text === 'Seconds') $(this).text('Секунди');
        });
      }, 500);
    });
  </script>
  <script>
    let stopwatch;

    function calculateElapsedSeconds() {
      const now = new Date();
      const kyivNow = new Date(now.toLocaleString("en-US", { timeZone: "Europe/Kyiv" }));
      const streamStart = new Date(kyivNow);
      streamStart.setHours(16, 0, 0, 0);
      const elapsedSeconds = Math.floor((kyivNow - streamStart) / 1000);
      return elapsedSeconds > 0 ? elapsedSeconds : 0;
    }

    function initStopwatch() {
      const elapsedSeconds = calculateElapsedSeconds();
      stopwatch = $('#stopwatch').FlipClock(elapsedSeconds, {
        clockFace: 'DailyCounter',
        countdown: false,
        autoStart: true
      });
      setTimeout(() => {
        $('#stopwatch .flip-clock-label').each(function() {
          const text = $(this).text().trim();
          if (text === 'Days') $(this).text('Дні');
          if (text === 'Hours') $(this).text('Години');
          if (text === 'Minutes') $(this).text('Хвилини');
          if (text === 'Seconds') $(this).text('Секунди');
        });
      }, 500);
    }

    $(document).ready(function() {
      initStopwatch();
    });
  </script>
</body>
</html>
