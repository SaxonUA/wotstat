<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <title>WOT донати та лайки</title>
  <style>
    body {
      background-color: transparent;
      font-family: 'Arial Black', sans-serif;
      color: white;
      text-align: center;
      margin: 0;
      padding: 0;
    }
    .container {
      background-color: rgba(0, 0, 0, 0.6);
      border-radius: 30px;
      padding: 25px 50px;
      width: fit-content;
      margin: 30px auto;
      box-shadow: 0 0 40px rgba(255,140,0,0.3);
    }
    .line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 20px 0;
    }
    .text-block {
      text-align: left;
      min-width: 200px;
    }
    .title {
      font-size: 22px;
      line-height: 1.2;
      font-weight: bold;
      text-transform: uppercase;
      background: linear-gradient(to right, #ffcc00, orange);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      opacity: 0.9;
    }
    .value {
      font-size: 36px;
      font-weight: bold;
      color: #fff;
      background: repeating-linear-gradient(45deg, rgba(255,255,255,0.2), rgba(255,255,255,0.2) 10px, transparent 10px, transparent 20px);
      padding: 10px 20px;
      border-radius: 10px;
      box-shadow: inset 0 0 10px rgba(255,255,255,0.2);
    }
    .divider {
      border-top: 3px solid #ff9900;
      margin: 20px 0;
    }
    .note {
      font-size: 22px;
      font-weight: bold;
      margin-top: 20px;
      background: linear-gradient(to right, #ffffff, orange);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="line"><div class="title">Початково</div><div class="value" id="start">...</div></div>
    <div class="line"><div class="title">За донати</div><div class="value" id="donations">...</div></div>
    <div class="line"><div class="title">За лайки</div><div class="value" id="likes">...</div></div>
    <div class="line"><div class="title">Всього за стрім</div><div class="value" id="total">...</div></div>

    <div class="divider"></div>

    <div class="line"><div class="title">Вже настріляв</div><div class="value" id="done">...</div></div>
    <div class="line"><div class="title">Залишилось виконати</div><div class="value" id="left">...</div></div>

    <div class="divider"></div>

    <div class="note">Кожна 1 грн додає <span style="color: orange">50 урону</span></div>
    <div class="note">Кожен 1 лайк додає <span style="color: orange">500 урону</span></div>
  </div>

  <script>
    const SHEET_ID = "17phnEn-NW-OnrZg4DcW65r-Xoq6ScsdVjS5yL0SS3fk";
    const GID = "1630188258";

    async function fetchSingleCell(range) {
      const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?gid=${GID}&range=${range}&tqx=out:json`;
      const res = await fetch(url);
      const text = await res.text();
      const json = JSON.parse(text.substring(47).slice(0, -2));
      return json.table.rows[0].c[0].v;
    }

    async function updateUI() {
      try {
        const [start, donations, likes, total, done, left] = await Promise.all([
          fetchSingleCell("C7"),
          fetchSingleCell("C8"),
          fetchSingleCell("C9"),
          fetchSingleCell("C10"),
          fetchSingleCell("C12"),
          fetchSingleCell("C14")
        ]);

        document.getElementById("start").innerText = Number(start).toLocaleString();
        document.getElementById("donations").innerText = Number(donations).toLocaleString();
        document.getElementById("likes").innerText = Number(likes).toLocaleString();
        document.getElementById("total").innerText = Number(total).toLocaleString();
        document.getElementById("done").innerText = Number(done).toLocaleString();
        document.getElementById("left").innerText = Number(left).toLocaleString();

      } catch (err) {
        console.error("Помилка оновлення даних:", err);
        document.getElementById("start").innerText = "Помилка";
        document.getElementById("donations").innerText = "Помилка";
        document.getElementById("likes").innerText = "Помилка";
        document.getElementById("total").innerText = "Помилка";
        document.getElementById("done").innerText = "Помилка";
        document.getElementById("left").innerText = "Помилка";
      }
    }

    updateUI();
    setInterval(updateUI, 15000);
  </script>
</body>
</html>
