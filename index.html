<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <title>WANTED COUNT</title>
  <link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      background-color: transparent;
      font-family: 'Special Elite', serif;
      color: #4B2E13;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    .container {
      width: 300px;
      height: 400px;
      background-color: rgba(255, 255, 255, 0.0);
      padding: 10px;
      box-sizing: border-box;
    }

    .divider {
      border-top: 2px solid #8B3E1F;
      margin: 10px 0;
    }

    .center-area {
      height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .count {
      font-size: 140px;
      line-height: 1;
      color: #4B2E13;
      text-shadow: 2px 2px 2px #e6c298;
      font-family: 'Special Elite', serif;
      max-width: 100%;
      max-height: 100%;
      overflow: hidden;
    }

    .footer {
      font-size: 18px;
      font-weight: bold;
      text-align: center;
      margin-top: 10px;
      text-shadow: 1px 1px 1px #e6c298;
    }

    .animated {
      animation: pop 0.4s ease-in-out;
    }

    @keyframes pop {
      0% { transform: scale(1); }
      50% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="divider"></div>

    <div class="center-area">
      <div class="count" id="artilleryCount">0</div>
    </div>

    <div class="divider"></div>

    <div class="footer">
      Боїв: <span id="battleCount">0</span> з <span id="battleGoal">10</span>
    </div>
  </div>

  <script>
    const maxBattles = 10;

    async function fetchStats() {
      const sheetId = '17phnEn-NW-OnrZg4DcW65r-Xoq6ScsdVjS5yL0SS3fk';
      const sheetName = 'arta_sum';
      const url = `https://opensheet.elk.sh/${sheetId}/${sheetName}`;

      try {
        const response = await fetch(url);
        const data = await response.json();
        if (data.length > 0) {
          const row = data[0];
          animateUpdate('artilleryCount', row['Сума арт'] || '0');
          updateBattleText(row['К-ть боїв'] || '0');
        }
      } catch (error) {
        console.error('Помилка при завантаженні даних:', error);
      }
    }

    function animateUpdate(id, newValue) {
      const el = document.getElementById(id);
      if (el.textContent !== newValue) {
        el.textContent = newValue;
        el.classList.add('animated');
        setTimeout(() => el.classList.remove('animated'), 400);
      }
    }

    function updateBattleText(battles) {
      document.getElementById('battleCount').textContent = battles;
      document.getElementById('battleGoal').textContent = maxBattles;
    }

    fetchStats();
    setInterval(fetchStats, 15000);
  </script>
</body>
</html>
